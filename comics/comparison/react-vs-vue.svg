<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- ============================================================
       源码漫画剧场 EP.18 · 终章对决：Pull 与 Push 的两位厨师
       画布 1200x800；横幅半蓝半绿对撞
       ============================================================ -->
  <defs>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <style>
      .t    { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }
      .dlg  { font-size: 16px; fill: #0f172a; }
      .name { font-size: 14px; font-weight: bold; fill: #ffffff; }
      .plab { font-size: 20px; font-weight: bold; fill: #0f172a; }
      .bsub { font-size: 18px; fill: #94a3b8; }
      .bttl { font-size: 30px; font-weight: bold; fill: #ffffff; }
      .bdg  { font-size: 22px; font-weight: bold; fill: #0f172a; }
      .chip { font-size: 15px; font-weight: bold; fill: #ffffff; }
      .sign { font-size: 15px; font-weight: bold; }
      .sh   { font-size: 18px; font-weight: bold; fill: #fbbf24; }
      .sb   { font-size: 15.5px; fill: #e2e8f0; }
      .prop { font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="800" fill="#f1f5f9"/>

  <!-- 顶部横幅（蓝绿对撞） -->
  <rect x="0" y="0" width="1200" height="96" fill="url(#banner)"/>
  <rect x="0" y="0" width="14" height="96" fill="#61dafb"/>
  <rect x="1186" y="0" width="14" height="96" fill="#42b883"/>
  <text class="t bsub" x="40" y="36">源码漫画剧场 · 终章对决</text>
  <text class="t bttl" x="40" y="74">第 18 话 · React vs Vue：两位厨师的做菜哲学</text>
  <rect x="1050" y="26" width="110" height="44" rx="22" fill="#fbbf24"/>
  <text class="t bdg" x="1105" y="55" text-anchor="middle">EP.18</text>

  <!-- ============ 格 1：阿R 的 Pull 灶台 ============ -->
  <rect x="40" y="124" width="540" height="280" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <circle cx="66" cy="150" r="14" fill="#61dafb"/>
  <text class="t chip" x="66" y="155" text-anchor="middle">1</text>
  <text class="t plab" x="88" y="156">场景一 · 阿R 的 Pull 灶台</text>

  <!-- 阿R -->
  <g transform="translate(150,330)">
    <ellipse cx="0" cy="60" rx="52" ry="10" fill="#e2e8f0"/>
    <line x1="0" y1="-56" x2="0" y2="-40" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-62" r="7" fill="#61dafb" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="-14" r="36" fill="#61dafb" stroke="#334155" stroke-width="3.5"/>
    <circle cx="-12" cy="-19" r="4.5" fill="#0f172a"/>
    <circle cx="12" cy="-19" r="4.5" fill="#0f172a"/>
    <path d="M -11 -5 Q 0 3 11 -5" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-28" y="18" width="56" height="42" rx="14" fill="#a5f3fc" stroke="#334155" stroke-width="3.5"/>
    <text x="0" y="46" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="18" font-weight="bold" fill="#0e7490">R</text>
  </g>
  <!-- 蓝色灶台与锅 -->
  <rect x="300" y="330" width="130" height="50" rx="8" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
  <rect x="320" y="298" width="90" height="34" rx="8" fill="#64748b" stroke="#334155" stroke-width="3"/>
  <rect x="296" y="258" width="138" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text class="t prop" x="365" y="279" text-anchor="middle" fill="#1e40af">重算整桌再 Diff</text>
  <!-- 阿R 气泡 -->
  <rect x="52" y="164" width="56" height="24" rx="12" fill="#0e7490"/>
  <text class="t name" x="80" y="181" text-anchor="middle">阿R</text>
  <rect x="52" y="192" width="230" height="76" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <polygon points="118,266 146,266 130,286" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="119" y="260" width="28" height="8" fill="#ffffff"/>
  <text class="t dlg" x="68" y="222">订单一来，我把整桌菜</text>
  <text class="t dlg" x="68" y="246">重算一遍，再找不同</text>

  <!-- ============ 格 2：阿V 的 Push 灶台 ============ -->
  <rect x="620" y="124" width="540" height="280" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <circle cx="646" cy="150" r="14" fill="#42b883"/>
  <text class="t chip" x="646" y="155" text-anchor="middle">2</text>
  <text class="t plab" x="668" y="156">场景二 · 阿V 的 Push 灶台</text>

  <!-- 绿色灶台与锅 -->
  <rect x="770" y="330" width="130" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <rect x="790" y="298" width="90" height="34" rx="8" fill="#86efac" stroke="#16a34a" stroke-width="3"/>
  <rect x="766" y="258" width="138" height="32" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
  <text class="t prop" x="835" y="279" text-anchor="middle" fill="#854d0e">摇铃只重做一盘</text>
  <!-- 阿V -->
  <g transform="translate(1050,330)">
    <ellipse cx="0" cy="60" rx="50" ry="10" fill="#e2e8f0"/>
    <circle cx="0" cy="-14" r="37" fill="#0ea56d" stroke="#334155" stroke-width="3.5"/>
    <circle cx="0" cy="-10" r="29" fill="#ffe3c9" stroke="#334155" stroke-width="3"/>
    <path d="M -37 -20 Q 0 -64 37 -20 L 37 -6 Q 20 -30 0 -30 Q -20 -30 -37 -6 Z" fill="#0ea56d" stroke="#334155" stroke-width="3"/>
    <polygon points="-9,-48 0,-64 9,-48" fill="#42b883" stroke="#334155" stroke-width="2.5"/>
    <circle cx="-10" cy="-12" r="4" fill="#0f172a"/>
    <circle cx="10" cy="-12" r="4" fill="#0f172a"/>
    <circle cx="-18" cy="-2" r="4" fill="#fca5a5"/>
    <circle cx="18" cy="-2" r="4" fill="#fca5a5"/>
    <path d="M -8 0 Q 0 6 8 0" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M -26 22 L 26 22 L 36 58 L -36 58 Z" fill="#42b883" stroke="#334155" stroke-width="3.5"/>
    <circle cx="-27" cy="30" r="6" fill="#ffe3c9" stroke="#334155" stroke-width="2.5"/>
    <circle cx="27" cy="30" r="6" fill="#ffe3c9" stroke="#334155" stroke-width="2.5"/>
  </g>
  <!-- 阿V 气泡 -->
  <rect x="918" y="164" width="56" height="24" rx="12" fill="#0f766e"/>
  <text class="t name" x="946" y="181" text-anchor="middle">阿V</text>
  <rect x="898" y="192" width="250" height="76" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <polygon points="1020,266 1048,266 1034,286" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="1021" y="260" width="28" height="8" fill="#ffffff"/>
  <text class="t dlg" x="914" y="222">数据一动摇铃，只叫醒</text>
  <text class="t dlg" x="914" y="246">订了那盘菜的人重做</text>

  <!-- ============ 格 3：没有输家的擂台 ============ -->
  <rect x="40" y="424" width="1120" height="212" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <circle cx="66" cy="450" r="14" fill="#fbbf24"/>
  <text class="t chip" x="66" y="455" text-anchor="middle">3</text>
  <text class="t plab" x="88" y="456">场景三 · 手动挡对自动挡，没有输家的擂台</text>

  <!-- 阿R 在最左 -->
  <g transform="translate(150,556)">
    <ellipse cx="0" cy="60" rx="52" ry="10" fill="#e2e8f0"/>
    <line x1="0" y1="-56" x2="0" y2="-40" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-62" r="7" fill="#61dafb" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="-14" r="36" fill="#61dafb" stroke="#334155" stroke-width="3.5"/>
    <circle cx="-12" cy="-19" r="4.5" fill="#0f172a"/>
    <circle cx="12" cy="-19" r="4.5" fill="#0f172a"/>
    <path d="M -11 -5 Q 0 3 11 -5" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-28" y="18" width="56" height="42" rx="14" fill="#a5f3fc" stroke="#334155" stroke-width="3.5"/>
    <text x="0" y="46" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="18" font-weight="bold" fill="#0e7490">R</text>
  </g>
  <!-- 阿V 在最右 -->
  <g transform="translate(1050,556)">
    <ellipse cx="0" cy="60" rx="50" ry="10" fill="#e2e8f0"/>
    <circle cx="0" cy="-14" r="37" fill="#0ea56d" stroke="#334155" stroke-width="3.5"/>
    <circle cx="0" cy="-10" r="29" fill="#ffe3c9" stroke="#334155" stroke-width="3"/>
    <path d="M -37 -20 Q 0 -64 37 -20 L 37 -6 Q 20 -30 0 -30 Q -20 -30 -37 -6 Z" fill="#0ea56d" stroke="#334155" stroke-width="3"/>
    <circle cx="-10" cy="-12" r="4" fill="#0f172a"/>
    <circle cx="10" cy="-12" r="4" fill="#0f172a"/>
    <circle cx="-18" cy="-2" r="4" fill="#fca5a5"/>
    <circle cx="18" cy="-2" r="4" fill="#fca5a5"/>
    <path d="M -8 0 Q 0 6 8 0" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M -26 22 L 26 22 L 36 58 L -36 58 Z" fill="#42b883" stroke="#334155" stroke-width="3.5"/>
    <circle cx="-27" cy="30" r="6" fill="#ffe3c9" stroke="#334155" stroke-width="2.5"/>
    <circle cx="27" cy="30" r="6" fill="#ffe3c9" stroke="#334155" stroke-width="2.5"/>
  </g>

  <!-- 两组牌子（在角色内侧，互不遮挡） -->
  <rect x="246" y="478" width="300" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text class="t sign" x="396" y="503" text-anchor="middle" fill="#1e40af">优化手动挡：useMemo / memo</text>
  <rect x="246" y="548" width="300" height="46" rx="10" fill="#0f172a"/>
  <text class="t" x="396" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#7dd3fc">重交互、复杂并发场景</text>

  <rect x="654" y="478" width="300" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text class="t sign" x="804" y="503" text-anchor="middle" fill="#166534">出厂自动挡：PatchFlag</text>
  <rect x="654" y="548" width="300" height="46" rx="10" fill="#0f172a"/>
  <text class="t" x="804" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#34d399">表单密集、快速上手场景</text>

  <!-- 中央 VS -->
  <circle cx="600" cy="525" r="34" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
  <text x="600" y="535" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="22" font-weight="bold" fill="#78350f">VS</text>

  <!-- 底部居中结论牌 -->
  <rect x="420" y="600" width="360" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text class="t prop" x="600" y="621" text-anchor="middle" fill="#92400e">两大范式正互相靠近（React Compiler / Vapor）</text>

  <!-- 知识条：码叔划重点 -->
  <rect x="40" y="656" width="1120" height="112" rx="16" fill="#0f172a"/>
  <g transform="translate(105,712)">
    <circle cx="0" cy="0" r="30" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
    <polygon points="-26,-22 -14,-34 -10,-20" fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
    <polygon points="26,-22 14,-34 10,-20" fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="-11" cy="-6" r="11" fill="#fffbeb" stroke="#78350f" stroke-width="2"/>
    <circle cx="11" cy="-6" r="11" fill="#fffbeb" stroke="#78350f" stroke-width="2"/>
    <circle cx="-11" cy="-6" r="4" fill="#0f172a"/>
    <circle cx="11" cy="-6" r="4" fill="#0f172a"/>
    <polygon points="0,0 -6,9 6,9" fill="#f97316" stroke="#78350f" stroke-width="2"/>
    <path d="M -18 12 Q 0 22 18 12" stroke="#78350f" stroke-width="2.5" fill="none"/>
  </g>
  <text class="t sh" x="155" y="688">码叔划重点</text>
  <text class="t sb" x="155" y="716">• Pull 对 Push：React 被触发后整棵子树重算再 Diff；Vue 用依赖图精准定位更新源</text>
  <text class="t sb" x="155" y="740">• React 把操作系统搬进浏览器（Lane/时间切片）；Vue 把静态知识交给编译器（Block/PatchFlag）</text>
  <text class="t sb" x="155" y="764">• React Compiler 与 Vue Vapor 都在吸收对方长处——选型看团队与场景，没有谁赢谁输</text>
</svg>

  </g>
  <!-- 阿R 小气泡 -->
  <rect x="170" y="432" width="270" height="62" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <polygon points="206,492 236,492 180,512" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="207" y="486" width="28" height="8" fill="#ffffff"/>
  <text class="t dlg" x="186" y="458">promise 的菜没好，</text>
  <text class="t dlg" x="186" y="482">先上 fallback 零食！</text>

  <!-- 阿V 在边界右端 -->
  <g transform="translate(1100,552)">
    <ellipse cx="0" cy="60" rx="50" ry="10" fill="#e2e8f0"/>
    <circle cx="0" cy="-14" r="37" fill="#0ea56d" stroke="#334155" stroke-width="3.5"/>
    <circle cx="0" cy="-10" r="29" fill="#ffe3c9" stroke="#334155" stroke-width="3"/>

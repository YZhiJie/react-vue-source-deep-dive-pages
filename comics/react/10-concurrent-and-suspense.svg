  <text class="t dlg" x="676" y="236">低优先级的半成品，</text>
  <text class="t dlg" x="676" y="260">急单一来就被打断，</text>
  <text class="t dlg" x="676" y="284">整盘倒掉重新做</text>

  <!-- ============ 格 3：等菜先上零食 ============ -->
  <rect x="40" y="424" width="1120" height="212" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <circle cx="66" cy="450" r="14" fill="#61dafb"/>
  <text class="t chip" x="66" y="455" text-anchor="middle">3</text>
  <text class="t plab" x="88" y="456">场景三 · 等菜先上零食</text>

  <!-- Suspense 边界（虚线框 + 吊牌） -->
  <rect x="290" y="480" width="620" height="140" rx="14" fill="#f0f9ff" stroke="#0e7490" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="510" y="466" width="180" height="28" rx="14" fill="#0e7490"/>
  <text class="t sign" x="600" y="485" text-anchor="middle" fill="#ffffff">Suspense 边界</text>


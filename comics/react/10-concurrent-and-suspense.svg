  <ellipse cx="420" cy="572" rx="50" ry="12" fill="#fde68a" stroke="#334155" stroke-width="3"/>
  <circle cx="402" cy="566" r="7" fill="#d97706" stroke="#334155" stroke-width="2"/>
  <circle cx="422" cy="563" r="7" fill="#d97706" stroke="#334155" stroke-width="2"/>
  <circle cx="440" cy="567" r="7" fill="#d97706" stroke="#334155" stroke-width="2"/>


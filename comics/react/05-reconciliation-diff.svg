<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- ============================================================
       源码漫画剧场 EP.05 · React 第 5 话：协调与 Diff（key 事故现场）
       画布 1200x800；布局：横幅 0-96 / 格1、2 y=124-404 / 格3 y=424-636 / 知识条 656-768
       ============================================================ -->
  <defs>
    <style>
      .t    { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }
      .dlg  { font-size: 16px; fill: #0f172a; }
      .name { font-size: 14px; font-weight: bold; fill: #ffffff; }
      .plab { font-size: 20px; font-weight: bold; fill: #0f172a; }
      .bsub { font-size: 18px; fill: #94a3b8; }
      .bttl { font-size: 30px; font-weight: bold; fill: #ffffff; }
      .bdg  { font-size: 22px; font-weight: bold; fill: #0f172a; }
      .chip { font-size: 15px; font-weight: bold; fill: #ffffff; }
      .sign { font-size: 15px; font-weight: bold; }
      .sh   { font-size: 18px; font-weight: bold; fill: #fbbf24; }
      .sb   { font-size: 15.5px; fill: #e2e8f0; }
      .prop { font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="800" fill="#f1f5f9"/>

  <!-- 顶部横幅 -->
  <rect x="0" y="0" width="1200" height="96" fill="#0f172a"/>
  <rect x="0" y="0" width="14" height="96" fill="#61dafb"/>
  <text class="t bsub" x="40" y="36">源码漫画剧场 · React 篇</text>
  <text class="t bttl" x="40" y="74">第 5 话 · 协调与 Diff：key 事故现场</text>
  <rect x="1050" y="26" width="110" height="44" rx="22" fill="#61dafb"/>
  <text class="t bdg" x="1105" y="55" text-anchor="middle">EP.05</text>

  <!-- ============ 格 1：场景一 · 串台事故 ============ -->
  <rect x="40" y="124" width="540" height="280" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <circle cx="66" cy="150" r="14" fill="#61dafb"/>
  <text class="t chip" x="66" y="155" text-anchor="middle">1</text>
  <text class="t plab" x="88" y="156">场景一 · 串台事故</text>

  <!-- 阿V（拍桌质问） -->
  <g transform="translate(140,342)">
    <ellipse cx="0" cy="60" rx="50" ry="10" fill="#e2e8f0"/>
    <circle cx="0" cy="-14" r="37" fill="#0ea56d" stroke="#334155" stroke-width="3.5"/>
    <circle cx="0" cy="-10" r="29" fill="#ffe3c9" stroke="#334155" stroke-width="3"/>
    <path d="M -37 -20 Q 0 -64 37 -20 L 37 -6 Q 20 -30 0 -30 Q -20 -30 -37 -6 Z" fill="#0ea56d" stroke="#334155" stroke-width="3"/>
    <polygon points="-9,-48 0,-64 9,-48" fill="#42b883" stroke="#334155" stroke-width="2.5"/>
    <circle cx="-10" cy="-12" r="4" fill="#0f172a"/>
    <circle cx="10" cy="-12" r="4" fill="#0f172a"/>
    <circle cx="-18" cy="-2" r="4" fill="#fca5a5"/>
    <circle cx="18" cy="-2" r="4" fill="#fca5a5"/>
    <path d="M -8 0 Q 0 6 8 0" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M -26 22 L 26 22 L 36 58 L -36 58 Z" fill="#42b883" stroke="#334155" stroke-width="3.5"/>
    <circle cx="-27" cy="30" r="6" fill="#ffe3c9" stroke="#334155" stroke-width="2.5"/>
    <circle cx="27" cy="30" r="6" fill="#ffe3c9" stroke="#334155" stroke-width="2.5"/>
  </g>
  <!-- 阿V 的名牌和气泡 -->
  <rect x="52" y="160" width="56" height="24" rx="12" fill="#42b883"/>
  <text class="t name" x="80" y="177" text-anchor="middle">阿V</text>
  <rect x="52" y="188" width="250" height="92" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <polygon points="112,276 136,276 122,294" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="113" y="272" width="28" height="8" fill="#ffffff"/>
  <text class="t dlg" x="68" y="214">列表头部插了个人，</text>
  <text class="t dlg" x="68" y="238">我输入框里的字怎么跑</text>
  <text class="t dlg" x="68" y="262">到别人碗里了？！</text>

  <!-- 串台便签道具 -->
  <rect x="246" y="360" width="150" height="34" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text class="t prop" x="321" y="382" text-anchor="middle" fill="#991b1b">没 key ＝ 按座位复用</text>

  <!-- 阿R（擦汗解释） -->
  <g transform="translate(430,340)">
    <ellipse cx="0" cy="60" rx="52" ry="10" fill="#e2e8f0"/>
    <line x1="0" y1="-56" x2="0" y2="-40" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-62" r="7" fill="#61dafb" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="-14" r="36" fill="#61dafb" stroke="#334155" stroke-width="3.5"/>
    <circle cx="-12" cy="-19" r="4.5" fill="#0f172a"/>
    <circle cx="12" cy="-19" r="4.5" fill="#0f172a"/>
    <path d="M -11 -5 Q 0 3 11 -5" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-28" y="18" width="56" height="42" rx="14" fill="#a5f3fc" stroke="#334155" stroke-width="3.5"/>
    <text x="0" y="46" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="18" font-weight="bold" fill="#0e7490">R</text>
    <path d="M 44 -56 Q 37 -44 44 -39 Q 51 -44 44 -56 Z" fill="#7dd3fc" stroke="#334155" stroke-width="2"/>
  </g>
  <!-- 阿R 的名牌和气泡 -->
  <rect x="330" y="138" width="56" height="24" rx="12" fill="#0e7490"/>
  <text class="t name" x="358" y="155" text-anchor="middle">阿R</text>
  <rect x="330" y="166" width="250" height="92" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <polygon points="390,256 420,256 405,276" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="391" y="250" width="28" height="8" fill="#ffffff"/>
  <text class="t dlg" x="346" y="192">没写 key，React 只能</text>
  <text class="t dlg" x="346" y="216">按座位号复用节点，</text>
  <text class="t dlg" x="346" y="240">state 就串台啦！</text>

  <!-- ============ 格 2：场景二 · 三大假设 ============ -->
  <rect x="620" y="124" width="540" height="280" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <circle cx="646" cy="150" r="14" fill="#61dafb"/>
  <text class="t chip" x="646" y="155" text-anchor="middle">2</text>
  <text class="t plab" x="668" y="156">场景二 · 三大假设</text>

  <!-- 阿R（讲解员） -->
  <g transform="translate(680,342)">
    <ellipse cx="0" cy="60" rx="52" ry="10" fill="#e2e8f0"/>
    <line x1="0" y1="-56" x2="0" y2="-40" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-62" r="7" fill="#61dafb" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="-14" r="36" fill="#61dafb" stroke="#334155" stroke-width="3.5"/>
    <circle cx="-12" cy="-19" r="4.5" fill="#0f172a"/>
    <circle cx="12" cy="-19" r="4.5" fill="#0f172a"/>
    <path d="M -11 -5 Q 0 3 11 -5" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-28" y="18" width="56" height="42" rx="14" fill="#a5f3fc" stroke="#334155" stroke-width="3.5"/>
    <text x="0" y="46" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="18" font-weight="bold" fill="#0e7490">R</text>
  </g>
  <!-- 阿R 的名牌和气泡 -->
  <rect x="648" y="168" width="56" height="24" rx="12" fill="#0e7490"/>
  <text class="t name" x="676" y="185" text-anchor="middle">阿R</text>
  <rect x="648" y="188" width="220" height="66" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <polygon points="708,252 732,252 718,272" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="709" y="246" width="28" height="8" fill="#ffffff"/>
  <text class="t dlg" x="664" y="214">Diff 不追最优解，三条</text>
  <text class="t dlg" x="664" y="238">假设换可预测，够快就行</text>

  <!-- 三大假设立牌 -->
  <rect x="880" y="200" width="250" height="152" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2.5"/>
  <text class="t sign" x="900" y="226" fill="#b45309">Diff 三大假设</text>
  <text class="t prop" x="900" y="254" fill="#0f172a">① 类型不同 → 拆了重建</text>
  <text class="t prop" x="900" y="282" fill="#0f172a">② 类型相同 → 只改属性</text>
  <text class="t prop" x="900" y="310" fill="#0f172a">③ key 相同 → 就是同一个人</text>
  <rect x="920" y="352" width="10" height="36" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
  <rect x="1080" y="352" width="10" height="36" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
  <!-- 角落小字 -->
  <text class="t" x="1146" y="150" text-anchor="end" font-size="14" fill="#64748b">O(n³) 压到 O(n)</text>

  <!-- ============ 格 3：场景三 · 名册对号 ============ -->
  <rect x="40" y="424" width="1120" height="212" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <circle cx="66" cy="450" r="14" fill="#61dafb"/>
  <text class="t chip" x="66" y="455" text-anchor="middle">3</text>
  <text class="t plab" x="88" y="456">场景三 · 名册对号</text>

  <!-- 阿R（手拿名册） -->
  <g transform="translate(110,566)">
    <ellipse cx="0" cy="60" rx="52" ry="10" fill="#e2e8f0"/>
    <line x1="0" y1="-56" x2="0" y2="-40" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-62" r="7" fill="#61dafb" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="-14" r="36" fill="#61dafb" stroke="#334155" stroke-width="3.5"/>
    <circle cx="-12" cy="-19" r="4.5" fill="#0f172a"/>
    <circle cx="12" cy="-19" r="4.5" fill="#0f172a"/>
    <path d="M -11 -5 Q 0 3 11 -5" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-28" y="18" width="56" height="42" rx="14" fill="#a5f3fc" stroke="#334155" stroke-width="3.5"/>
    <text x="0" y="46" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="18" font-weight="bold" fill="#0e7490">R</text>
  </g>
  <!-- 名册道具 -->
  <line x1="140" y1="592" x2="158" y2="580" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <rect x="150" y="548" width="78" height="52" rx="6" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
  <line x1="162" y1="548" x2="162" y2="600" stroke="#7f1d1d" stroke-width="2"/>
  <rect x="167" y="560" width="56" height="24" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="t prop" x="195" y="577" text-anchor="middle" fill="#991b1b">key 名册</text>
  <text class="t" x="189" y="614" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">旧节点建名册</text>

  <!-- 阿R 的名牌和气泡 -->
  <rect x="310" y="440" width="56" height="24" rx="12" fill="#0e7490"/>
  <text class="t name" x="338" y="457" text-anchor="middle">阿R</text>
  <rect x="310" y="468" width="300" height="92" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <polygon points="310,494 310,518 264,540" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="305" y="498" width="9" height="16" fill="#ffffff"/>
  <text class="t dlg" x="326" y="494">旧节点按 key 建名册，</text>
  <text class="t dlg" x="326" y="518">遍历新列表查名册，序号</text>
  <text class="t dlg" x="326" y="542">递增就不挪窝，乱了才移动</text>

  <!-- 旧链框 与 名册 Map 表 -->
  <rect x="660" y="470" width="200" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text class="t sign" x="760" y="498" text-anchor="middle" fill="#1e40af">旧节点链：A B C</text>
  <rect x="868" y="487" width="36" height="6" fill="#334155"/>
  <polygon points="904,479 904,501 920,490" fill="#334155"/>
  <rect x="920" y="452" width="210" height="72" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text class="t" x="1025" y="474" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">名册 Map</text>
  <text class="t" x="1025" y="502" text-anchor="middle" font-size="14" fill="#0f172a">A→0 ｜ B→1 ｜ C→2</text>

  <!-- 三种结局牌 -->
  <text class="t" x="630" y="546" font-size="13" fill="#64748b">新列表逐个查名册，三种结局：</text>
  <rect x="630" y="556" width="160" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text class="t sign" x="710" y="584" text-anchor="middle" fill="#1e40af">递增 → 不挪窝</text>
  <rect x="805" y="556" width="160" height="44" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
  <text class="t sign" x="885" y="584" text-anchor="middle" fill="#854d0e">变小 → 要移动</text>
  <rect x="980" y="556" width="160" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text class="t sign" x="1060" y="584" text-anchor="middle" fill="#166534">查不到 → 新建</text>

  <!-- ============ 知识条：码叔划重点 ============ -->
  <rect x="40" y="656" width="1120" height="112" rx="16" fill="#0f172a"/>
  <g transform="translate(105,712)">
    <circle cx="0" cy="0" r="30" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
    <polygon points="-26,-22 -14,-34 -10,-20" fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
    <polygon points="26,-22 14,-34 10,-20" fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="-11" cy="-6" r="11" fill="#fffbeb" stroke="#78350f" stroke-width="2"/>
    <circle cx="11" cy="-6" r="11" fill="#fffbeb" stroke="#78350f" stroke-width="2"/>
    <circle cx="-11" cy="-6" r="4" fill="#0f172a"/>
    <circle cx="11" cy="-6" r="4" fill="#0f172a"/>
    <polygon points="0,0 -6,9 6,9" fill="#f97316" stroke="#78350f" stroke-width="2"/>
    <path d="M -18 12 Q 0 22 18 12" stroke="#78350f" stroke-width="2.5" fill="none"/>
  </g>
  <text class="t sh" x="155" y="688">码叔划重点</text>
  <text class="t sb" x="155" y="716">• Diff 三假设把 O(n³) 优化到 O(n)：跨类型重建、同类型复用、key 自报家门</text>
  <text class="t sb" x="155" y="740">• 不写 key 按位置复用会 state 串台；用数组下标当 key 等于没写</text>
  <text class="t sb" x="155" y="764">• 乱序 diff：旧列表按 key 建 Map，遍历新列表比对，oldIndex 递增则不移动</text>
</svg>

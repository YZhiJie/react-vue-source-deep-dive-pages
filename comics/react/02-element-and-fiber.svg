  <text class="t sh" x="155" y="688">码叔划重点</text>
  <text class="t sb" x="155" y="716">• Element 是不可变剧本：只描述演什么，用完即弃</text>
  <text class="t sb" x="155" y="740">• Fiber 是可变演出档案：child/sibling/return 三指针串起的工作单元</text>
  <text class="t sb" x="155" y="764">• 双缓存：后台排练 workInProgress，换景时 current 一次切换</text>

    <circle cx="11" cy="-6" r="4" fill="#0f172a"/>
    <polygon points="0,0 -6,9 6,9" fill="#f97316" stroke="#78350f" stroke-width="2"/>
    <path d="M -18 12 Q 0 22 18 12" stroke="#78350f" stroke-width="2.5" fill="none"/>
  </g>
  <text class="t sh" x="155" y="688">码叔划重点</text>
  <text class="t sb" x="155" y="716">• create() 一块白板：state 锁在 vanilla 闭包，set 合并 + 通知 listeners，无 Provider 无 Context</text>
  <text class="t sb" x="155" y="740">• selector 订栏目 + Object.is 浅比较；返回对象/数组记得套 useShallow，否则每次摇铃都重渲染</text>
  <text class="t sb" x="155" y="764">• persist 中间件包装 set：写完拍照存 localStorage，刷新走 hydration 贴回；partialize 挑要存的字段</text>
</svg>

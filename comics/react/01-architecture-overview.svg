  <circle cx="780" cy="584" r="8" fill="#64748b"/>
  <circle cx="900" cy="584" r="8" fill="#64748b"/>

  <!-- UI = f(state) 公式牌 -->
  <rect x="480" y="596" width="240" height="34" rx="10" fill="#0f172a"/>
  <text class="t" x="600" y="619" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">UI = f(state)</text>


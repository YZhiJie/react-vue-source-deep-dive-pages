  <rect x="660" y="186" width="250" height="92" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <polygon points="720,276 748,276 732,296" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="721" y="270" width="28" height="8" fill="#ffffff"/>
  <text class="t dlg" x="676" y="212">render 就是备菜：把每盘</text>
  <text class="t dlg" x="676" y="236">菜的样子先算出来，纯计</text>
  <text class="t dlg" x="676" y="260">算，绝不动餐桌上的真菜</text>


  <!-- 三工位牌子 -->
  <rect x="140" y="500" width="200" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text class="t sign" x="240" y="528" text-anchor="middle" fill="#1e40af">① 接单 Schedule</text>
  <rect x="500" y="500" width="200" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>

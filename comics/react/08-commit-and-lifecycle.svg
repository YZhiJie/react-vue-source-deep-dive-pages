  <text class="t sh" x="155" y="688">码叔划重点</text>
  <text class="t sb" x="155" y="716">• commit 三个同步子阶段加延迟 Passive：读快照 → 改真实 DOM → 执行 layout effect → 绘制后再跑 passive effect</text>
  <text class="t sb" x="155" y="740">• root.current 在 mutation 阶段切换：保证 layout 阶段读到的一定是新树，卸载时读到旧树</text>
  <text class="t sb" x="155" y="764">• React 19 用 subtreeFlags 位掩码递归剪枝，不再构建 effect list</text>
</svg>

  <text class="t sh" x="155" y="688">码叔划重点</text>
  <text class="t sb" x="155" y="716">• Update 挂在环形链表上按 lane 消费：被跳过的低优先级更新留到下次重放</text>
  <text class="t sb" x="155" y="740">• eagerState 提前算第一个更新：值没变就 bailout，省掉一整轮 render</text>
  <text class="t sb" x="155" y="764">• 完整链路：setState 入队 → markRootUpdated → ensureRootIsScheduled → render → commit</text>

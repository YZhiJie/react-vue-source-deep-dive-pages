  <text class="t sh" x="155" y="688">码叔划重点</text>
  <text class="t sb" x="155" y="716">• 状态挂在 fiber.memoizedState 的 hook 链表上，只认调用顺序，不能写在条件或循环里</text>
  <text class="t sb" x="155" y="740">• react 包只是薄壳，四套 Dispatcher 按渲染阶段注入真实实现</text>
  <text class="t sb" x="155" y="764">• useEffect 靠 tag 和 HasEffect 位标记，决定本次是否真正执行</text>
</svg>

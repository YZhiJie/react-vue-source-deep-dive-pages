  <text class="t sh" x="155" y="688">码叔划重点</text>
  <text class="t sb" x="155" y="716">• 单一账本闭包上锁：改账唯一通道是 dispatch(action)，reducer 纯函数誊写新账页</text>
  <text class="t sb" x="155" y="740">• 中间件洋葱管线逐关放行；thunk 认出函数单据，当场代办、不进账房</text>
  <text class="t sb" x="155" y="764">• useSelector 只订栏目、引用没变不打扰；createSlice 涂改 draft，Immer 暗中誊新页</text>
</svg>

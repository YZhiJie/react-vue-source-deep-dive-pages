<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- ============================================================
       源码漫画剧场 EP.04 · React 第 4 话：render 阶段——可中断的深度优先遍历
       画布 1200x800；布局：横幅 0-96 / 格1、2 y=124-404 / 格3 y=424-636 / 知识条 656-768
       ============================================================ -->
  <defs>
    <style>
      .t    { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }
      .dlg  { font-size: 16px; fill: #0f172a; }
      .name { font-size: 14px; font-weight: bold; fill: #ffffff; }
      .plab { font-size: 20px; font-weight: bold; fill: #0f172a; }
      .bsub { font-size: 18px; fill: #94a3b8; }
      .bttl { font-size: 30px; font-weight: bold; fill: #ffffff; }
      .bdg  { font-size: 22px; font-weight: bold; fill: #0f172a; }
      .chip { font-size: 15px; font-weight: bold; fill: #ffffff; }
      .sign { font-size: 15px; font-weight: bold; }
      .sh   { font-size: 18px; font-weight: bold; fill: #fbbf24; }
      .sb   { font-size: 15.5px; fill: #e2e8f0; }
      .prop { font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="800" fill="#f1f5f9"/>

  <!-- 顶部横幅 -->
  <rect x="0" y="0" width="1200" height="96" fill="#0f172a"/>
  <rect x="0" y="0" width="14" height="96" fill="#61dafb"/>
  <text class="t bsub" x="40" y="36">源码漫画剧场 · React 篇</text>
  <text class="t bttl" x="40" y="74">第 4 话 · render 阶段：可中断的深度优先遍历</text>
  <rect x="1050" y="26" width="110" height="44" rx="22" fill="#61dafb"/>
  <text class="t bdg" x="1105" y="55" text-anchor="middle">EP.04</text>

  <!-- ============ 格 1：备菜能停，上菜不能停 ============ -->
  <rect x="40" y="124" width="540" height="280" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <circle cx="66" cy="150" r="14" fill="#61dafb"/>
  <text class="t chip" x="66" y="155" text-anchor="middle">1</text>
  <text class="t plab" x="88" y="156">场景一 · 备菜能停</text>

  <!-- 暂停牌（立在砧板旁） -->
  <rect x="64" y="252" width="118" height="32" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/>
  <text class="t prop" x="123" y="273" text-anchor="middle" fill="#991b1b">随时可暂停</text>
  <line x1="123" y1="284" x2="123" y2="318" stroke="#334155" stroke-width="3"/>

  <!-- 砧板与菜刀 -->
  <rect x="66" y="336" width="150" height="46" rx="12" fill="#d9a066" stroke="#7c4a1e" stroke-width="3"/>
  <rect x="96" y="350" width="26" height="10" rx="3" fill="#7c4a1e" stroke="#451a03" stroke-width="2"/>
  <polygon points="122,352 182,344 182,358 122,360" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <circle cx="198" cy="360" r="10" fill="#4ade80" stroke="#166534" stroke-width="2"/>
  <text class="t prop" x="141" y="401" text-anchor="middle" font-size="12.5" fill="#7c4a1e">render 备菜砧板</text>

  <!-- 阿R（厨师版：加厨师帽） -->
  <g transform="translate(432,342)">
    <ellipse cx="0" cy="60" rx="52" ry="10" fill="#e2e8f0"/>
    <line x1="0" y1="-56" x2="0" y2="-40" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-62" r="7" fill="#61dafb" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="-14" r="36" fill="#61dafb" stroke="#334155" stroke-width="3.5"/>
    <circle cx="-12" cy="-19" r="4.5" fill="#0f172a"/>
    <circle cx="12" cy="-19" r="4.5" fill="#0f172a"/>
    <path d="M -11 -5 Q 0 3 11 -5" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-28" y="18" width="56" height="42" rx="14" fill="#a5f3fc" stroke="#334155" stroke-width="3.5"/>
    <text x="0" y="46" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="18" font-weight="bold" fill="#0e7490">R</text>
    <rect x="-20" y="-64" width="40" height="16" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <rect x="-14" y="-76" width="28" height="14" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  </g>
  <!-- 阿R 的气泡 -->
  <rect x="300" y="138" width="56" height="24" rx="12" fill="#0e7490"/>
  <text class="t name" x="328" y="155" text-anchor="middle">阿R</text>
  <rect x="300" y="166" width="258" height="96" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <polygon points="386,262 416,262 400,282" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="387" y="256" width="28" height="8" fill="#ffffff"/>
  <text class="t dlg" x="316" y="194">备菜 render 随时能放下，</text>
  <text class="t dlg" x="316" y="220">上菜 commit 绝不能</text>
  <text class="t dlg" x="316" y="246">半途而废</text>

  <!-- ============ 格 2：沿 fiber 树爬上爬下 ============ -->
  <rect x="620" y="124" width="540" height="280" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <circle cx="646" cy="150" r="14" fill="#61dafb"/>
  <text class="t chip" x="646" y="155" text-anchor="middle">2</text>
  <text class="t plab" x="668" y="156">场景二 · 沿 fiber 树爬上爬下</text>

  <!-- 两块立牌：递与归 -->
  <rect x="644" y="172" width="246" height="36" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text class="t prop" x="767" y="195" text-anchor="middle" fill="#1e40af">beginWork 递：向下找活干</text>
  <rect x="900" y="172" width="246" height="36" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text class="t prop" x="1023" y="195" text-anchor="middle" fill="#166534">completeWork 归：向上收副作用</text>

  <!-- fiber 树：连线 -->
  <line x1="808" y1="250" x2="712" y2="295" stroke="#94a3b8" stroke-width="3"/>
  <line x1="832" y1="250" x2="928" y2="295" stroke="#94a3b8" stroke-width="3"/>
  <line x1="692" y1="325" x2="688" y2="365" stroke="#94a3b8" stroke-width="3"/>
  <line x1="708" y1="325" x2="782" y2="365" stroke="#94a3b8" stroke-width="3"/>
  <!-- fiber 树：节点 -->
  <rect x="786" y="220" width="68" height="30" rx="8" fill="#a5f3fc" stroke="#0e7490" stroke-width="3"/>
  <text class="t" x="820" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#0e7490">App</text>
  <rect x="666" y="295" width="68" height="30" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text class="t" x="700" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">div</text>
  <rect x="906" y="295" width="68" height="30" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text class="t" x="940" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">span</text>
  <rect x="646" y="365" width="68" height="28" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text class="t" x="680" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">p</text>
  <rect x="756" y="365" width="68" height="28" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text class="t" x="790" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">h1</text>

  <!-- 爬上爬下的双向箭头 -->
  <line x1="1004" y1="262" x2="1004" y2="348" stroke="#2563eb" stroke-width="3.5"/>
  <polygon points="997,338 1004,352 1011,338" fill="#2563eb"/>
  <line x1="1026" y1="348" x2="1026" y2="262" stroke="#16a34a" stroke-width="3.5"/>
  <polygon points="1019,272 1026,258 1033,272" fill="#16a34a"/>
  <text class="t prop" x="1004" y="370" text-anchor="middle" fill="#2563eb">递</text>
  <text class="t prop" x="1026" y="370" text-anchor="middle" fill="#16a34a">归</text>

  <!-- 阿R（缩小，挂在树旁爬上爬下） -->
  <g transform="translate(1078,336) scale(0.78)">
    <ellipse cx="0" cy="60" rx="52" ry="10" fill="#e2e8f0"/>
    <line x1="0" y1="-56" x2="0" y2="-40" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-62" r="7" fill="#61dafb" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="-14" r="36" fill="#61dafb" stroke="#334155" stroke-width="3.5"/>
    <circle cx="-12" cy="-19" r="4.5" fill="#0f172a"/>
    <circle cx="12" cy="-19" r="4.5" fill="#0f172a"/>
    <path d="M -11 -5 Q 0 3 11 -5" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-28" y="18" width="56" height="42" rx="14" fill="#a5f3fc" stroke="#334155" stroke-width="3.5"/>
    <text x="0" y="46" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="18" font-weight="bold" fill="#0e7490">R</text>
  </g>

  <!-- ============ 格 3：finishedWork 出餐托盘 ============ -->
  <rect x="40" y="424" width="1120" height="212" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <circle cx="66" cy="450" r="14" fill="#61dafb"/>
  <text class="t chip" x="66" y="455" text-anchor="middle">3</text>
  <text class="t plab" x="88" y="456">场景三 · finishedWork 出餐托盘</text>

  <!-- 阿R（服务员机器人） -->
  <g transform="translate(112,552)">
    <ellipse cx="0" cy="60" rx="52" ry="10" fill="#e2e8f0"/>
    <line x1="0" y1="-56" x2="0" y2="-40" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-62" r="7" fill="#61dafb" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="-14" r="36" fill="#61dafb" stroke="#334155" stroke-width="3.5"/>
    <circle cx="-12" cy="-19" r="4.5" fill="#0f172a"/>
    <circle cx="12" cy="-19" r="4.5" fill="#0f172a"/>
    <path d="M -11 -5 Q 0 3 11 -5" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-28" y="18" width="56" height="42" rx="14" fill="#a5f3fc" stroke="#334155" stroke-width="3.5"/>
    <text x="0" y="46" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="18" font-weight="bold" fill="#0e7490">R</text>
  </g>

  <!-- 出餐托盘 -->
  <rect x="372" y="505" width="456" height="92" rx="20" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
  <rect x="392" y="522" width="416" height="58" rx="29" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>

  <!-- 副作用清单（一张纸） -->
  <rect x="432" y="470" width="336" height="100" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="452" y="440" width="296" height="28" rx="8" fill="#0f172a"/>
  <text class="t" x="600" y="459" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">finishedWork 副作用清单</text>

  <rect x="448" y="481" width="62" height="20" rx="4" fill="#f59e0b"/>
  <text class="t" x="479" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Update</text>
  <text class="t" x="520" y="496" font-size="13" font-weight="bold" fill="#0f172a">div · props 变了</text>

  <rect x="448" y="509" width="72" height="20" rx="4" fill="#2563eb"/>
  <text class="t" x="484" y="523" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Placement</text>
  <text class="t" x="530" y="524" font-size="13" font-weight="bold" fill="#0f172a">新增 h1 节点</text>

  <rect x="448" y="537" width="104" height="20" rx="4" fill="#16a34a"/>
  <text class="t" x="500" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">subtreeFlags</text>
  <text class="t" x="562" y="552" font-size="13" font-weight="bold" fill="#0f172a">子树副作用已向上冒泡</text>

  <!-- 红色印章：一行 DOM 没动 -->
  <g transform="rotate(-6 936 545)">
    <rect x="836" y="516" width="200" height="58" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/>
    <text class="t" x="936" y="552" text-anchor="middle" font-size="18" font-weight="bold" fill="#dc2626">一行 DOM 没动</text>
  </g>

  <!-- ============ 知识条：码叔划重点 ============ -->
  <rect x="40" y="656" width="1120" height="112" rx="16" fill="#0f172a"/>
  <g transform="translate(105,712)">
    <circle cx="0" cy="0" r="30" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
    <polygon points="-26,-22 -14,-34 -10,-20" fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
    <polygon points="26,-22 14,-34 10,-20" fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="-11" cy="-6" r="11" fill="#fffbeb" stroke="#78350f" stroke-width="2"/>
    <circle cx="11" cy="-6" r="11" fill="#fffbeb" stroke="#78350f" stroke-width="2"/>
    <circle cx="-11" cy="-6" r="4" fill="#0f172a"/>
    <circle cx="11" cy="-6" r="4" fill="#0f172a"/>
    <polygon points="0,0 -6,9 6,9" fill="#f97316" stroke="#78350f" stroke-width="2"/>
    <path d="M -18 12 Q 0 22 18 12" stroke="#78350f" stroke-width="2.5" fill="none"/>
  </g>
  <text class="t sh" x="155" y="688">码叔划重点</text>
  <text class="t sb" x="155" y="716">• render 是可中断的深度优先遍历：beginWork 向下分派，completeWork 向上归集</text>
  <text class="t sb" x="155" y="740">• completeWork 计算 props 差异、打副作用标记，产出 finishedWork 草稿树</text>
  <text class="t sb" x="155" y="764">• 全程纯计算不碰真 DOM，被打断就把草稿丢弃、从根重来</text>
</svg>

  <text class="t sh" x="155" y="688">码叔划重点</text>
  <text class="t sb" x="155" y="716">• Vue 3.5 用 Dep 与 Link 双向链表替代 subs Set：依赖就是 effect 与 dep 之间的连线</text>
  <text class="t sb" x="155" y="740">• get 时 track 建立 Link，set 时 trigger 沿链通知，computed 惰性求值</text>
  <text class="t sb" x="155" y="764">• Proxy 一次代理整个对象，新增属性与数组下标自动响应，无需 $set</text>
